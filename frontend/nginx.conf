# Servidor de la SPA dentro del contenedor (imagen nginx-unprivileged, puerto 8080).
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Subidas de archivos: el límite de fábrica de nginx es 1 MB, y con él una foto normal
    # nunca llega a events-service. Se pone por encima del tope de Kestrel (30 000 000 bytes,
    # también de fábrica) para que el que corte sea el servicio y no el proxy. Ojo: hoy ese
    # corte es un 413 pelado, sin el `code` que el resto de la API trae; el límite deliberado,
    # con su error propio, es trabajo aparte y cuando llegue quedará muy por debajo de acá.
    client_max_body_size 32m;

    # Un nombre escrito literalmente en proxy_pass se resuelve UNA sola vez, al
    # arrancar, y nginx se queda con esa IP mientras viva el proceso. Cuando un
    # despliegue recrea un servicio, el contenedor vuelve con otra IP y este nginx
    # sigue hablándole a la vieja: 502 en todo lo que le reenvíe, hasta que alguien
    # reinicie el frontend a mano.
    #
    # El DNS interno de Docker responde en 127.0.0.11. Con un resolver declarado y el
    # destino puesto en una variable, nginx resuelve por petición y respeta `valid`,
    # así que un servicio recreado se vuelve alcanzable solo en unos segundos.
    #
    # OJO al agregar un destino: la variable en proxy_pass apaga el reenvío automático
    # de la URI, así que hay que concatenar $request_uri (que ya trae la query).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Liveness, siguiendo la convención /_alive de la plataforma.
    location = /_alive {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Rutas de convocatorias. Son las dos únicas por las que convocatorias-service se
    # alcanza desde internet: no tiene router en Traefik ni hostname propio, así que lo
    # que no esté enumerado acá —/scalar y /openapi/v1.json, entre otros— sencillamente
    # no llega. /v1/public/ es el portal de registro, anónimo; /v1/convocatorias/ es
    # todo lo interno. nginx elige el prefijo más largo, de modo que ganan sobre /v1/.
    # Al agregar una ruta hay que sumarla también a `vite.config.ts`.
    # Los interruptores públicos son de events-service aunque cuelguen de /v1/public/: el prefijo
    # más largo gana, así que esta va antes que la de convocatorias. Gemela en `vite.config.ts`.
    location /v1/public/feature-switches {
        set $events_service http://events-service:8080;
        proxy_pass $events_service$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/public/ {
        set $convocatorias_service http://convocatorias-service:8080;
        proxy_pass $convocatorias_service$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/convocatorias/ {
        set $convocatorias_service http://convocatorias-service:8080;
        proxy_pass $convocatorias_service$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Historial de envíos de notification-service, que la pantalla de Reportes lee
    # (ADR-0023). Se abren dos rutas exactas y nada más: el listado y el detalle de un
    # lote. Solo GET, porque la pantalla solo lee: el envío (POST /v1/notifications) es
    # de las cuentas de servicio y no tiene por qué ser alcanzable desde el navegador,
    # aunque el rol ya lo cierre en el servicio. /v1/notifications/orphan-events no se
    # enruta: ninguna pantalla lo lee, así que cae en /v1/ de abajo y events-service
    # responde 404. Al agregar una ruta hay que sumarla también a `vite.config.ts`.
    location = /v1/notifications {
        limit_except GET { deny all; }
        set $notification_service http://notification-service:8080;
        proxy_pass $notification_service$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Un solo segmento tras batches/: el id del lote, y nada debajo de él.
    location ~ ^/v1/notifications/batches/[^/]+$ {
        limit_except GET { deny all; }
        set $notification_service http://notification-service:8080;
        proxy_pass $notification_service$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API: el navegador llama /v1 en el mismo origen y nginx lo reenvía a
    # events-service por el nombre del servicio (DNS de la red de Compose),
    # evitando CORS.
    location /v1/ {
        set $events_service http://events-service:8080;
        proxy_pass $events_service$request_uri;
        # El acta en PDF de un sorteo grande tarda más de los 60 s de fábrica (medido: ~65 s con
        # 10.000 premios en la laptop, A3); sin esto nginx corta con 504 y el acta no llega.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets con hash en el nombre: cachear agresivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta del router cae a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
