# ===========================================================================
# Quién entra a PostgreSQL y cómo. Postgres lo lee por el flag
# `-c hba_file=...` del compose, no desde su carpeta de datos: el pg_hba.conf de la
# carpeta de datos queda intacto, y revertir el compose devuelve el servidor de antes.
#
# Toda conexión por red va cifrada y con clave. Una conexión por red sin TLS se
# rechaza, venga de donde venga.
# ===========================================================================

# TYPE     DATABASE  USER  ADDRESS  METHOD

# El socket local, solo desde adentro del contenedor: lo usan el healthcheck
# (pg_isready), `docker exec ... psql` para administrar y el init de la imagen.
local      all       all            trust

hostssl    all       all   all      scram-sha-256
hostnossl  all       all   all      reject
