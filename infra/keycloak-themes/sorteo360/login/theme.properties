# Tema de login de Sorteo360.
#
# Es un tema hijo de keycloak.v2 y solo aporta CSS: no se bifurca ninguna plantilla
# FreeMarker. Heredarlas todas es lo que hace que una actualización de Keycloak no
# rompa en silencio la única pantalla que no puede romperse.
parent=keycloak.v2

# La lista de hojas de estilo NO se acumula con la del padre: al declararla aquí hay
# que repetir la suya (css/styles.css), o el login se queda sin los estilos base.
# El primer archivo se resuelve en keycloak.v2, el segundo en este tema.
styles=css/styles.css css/sorteo360.css

# Keycloak corre en otro origen que la aplicación y no puede leer la preferencia de
# tema que el usuario guardó allí. Si el usuario fuerza un modo distinto al del
# sistema operativo, las dos pantallas se contradicen. Solo modo claro.
darkMode=false

# El único idioma que este tema traduce. Keycloak arma el selector de idioma con la
# intersección de esta lista y los locales que habilita el realm; con un solo idioma
# no dibuja selector, que es lo que se quiere para Sorteo360.
#
# Los textos están en messages/messages_es.properties, y ese archivo se superpone al
# español de fábrica de Keycloak clave por clave, no lo reemplaza.
locales=es

# Clases propias colgadas de las claves del tema padre.
#
# Cada una de estas claves es el nombre con el que las plantillas de keycloak.v2
# escriben la clase de un elemento. Agregarle acá una clase nuestra es lo que deja
# que resources/css/sorteo360.css redefina ese elemento con un solo selector de clase,
# en vez de encadenar selectores de PatternFly hasta ganarle por especificidad. Lo
# que hay del otro lado son casi siempre variables suyas, que es como PatternFly
# espera que lo vistan.
#
# El valor NO se acumula con el del padre: hay que repetir sus clases o el elemento
# se queda sin los estilos base. La copia de referencia está en la imagen de
# Keycloak, en theme/keycloak.v2/login/theme.properties.
kcLogin=pf-v5-c-login sorteo360-login
kcLoginMain=pf-v5-c-login__main sorteo360-card
kcLoginMainHeader=pf-v5-c-login__main-header sorteo360-card-header
kcFormLabelTextClass=pf-v5-c-form__label-text sorteo360-label
kcInputClass=pf-v5-c-form-control sorteo360-input
kcInputErrorMessageClass=pf-v5-c-helper-text__item-text pf-m-error kc-feedback-text sorteo360-field-error
kcFormPasswordVisibilityButtonClass=pf-v5-c-button pf-m-control sorteo360-password-toggle
kcButtonPrimaryClass=pf-v5-c-button pf-m-primary sorteo360-button
kcAlertClass=pf-v5-c-alert pf-m-inline pf-v5-u-mb-md sorteo360-alert

# Al título se le quita además el modificador de tamaño de PatternFly (pf-m-3xl):
# el tamaño lo fija la hoja, y quitarlo de acá evita tener que pisarlo con un
# selector más específico.
kcLoginMainTitle=pf-v5-c-title sorteo360-title
