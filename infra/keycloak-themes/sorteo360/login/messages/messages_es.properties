# Textos en español de la pantalla de login de Sorteo360.
#
# Keycloak trae su propio español, y ese es justo el problema: está a medias y mezcla
# registros. En una misma pantalla conviven "¿Has olvidado tu contraseña?" y "Confirme la
# contraseña". Acá se fija el tuteo, que es como habla el resto del producto y la
# experiencia corporativa de Sorteo360.
#
# Keycloak lee este archivo como UTF-8, así que las tildes y la ñ van tal cual, sin
# escapes \uXXXX.
#
# Este archivo NO reemplaza al de Keycloak: se superpone clave por clave. Lo que no esté
# acá sale con el texto de fábrica, en usted. Por eso no se declaran solo las frases mal
# traducidas, sino las de todas las pantallas que este realm puede mostrar: el formulario
# de login, las páginas de error, expiración y cierre de sesión, la acción requerida de
# cambiar contraseña, y los mensajes que el flujo de autenticación emite en caliente.
# Fijar una frase que hoy está bien no es de más: es lo que evita que una actualización de
# Keycloak la devuelva al usted sin que nada falle ni se registre en ningún log.
#
# Lo que queda afuera, a propósito:
#   - las claves de pantallas que el realm no enciende: OTP, WebAuthn, federación,
#     organizaciones y el flujo de dispositivo (`code-*`, `oauth2Device*`). Encender
#     cualquiera de esas trae pantallas nuevas, y sus claves entran acá en el mismo PR o
#     media pantalla sale en usted;
#   - `loginTitleHtml`, que es `{0}` y no tiene texto que traducir.
#
# Sí están `doRegister`, `noAccount` y `doForgotPassword`, aunque hoy no se dibujen
# (`registrationAllowed: false`, sin recuperación de contraseña): las tres aparecen con un
# switch de la consola, no con un despliegue, y así el switch no deja frases en inglés.
#
# Nada de esto lo verifica una herramienta: que una frase alcanzable no quede sin fijar,
# y que ninguna vuelva al usted, se comprueba leyendo la pantalla. Lo que sí conviene
# revisar al subir Keycloak de versión está en el README de este tema.
#
# Ojo con las comillas simples: en un valor con parámetros {0} hay que escribirlas
# dobles ('') o MessageFormat se las come.

